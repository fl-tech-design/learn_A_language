name: learn_a_language
description: A language learning app - Flutter migration from Kivy.
publish_to: 'none'
version: 1.12.0+24

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  path_provider: ^2.1.1
  package_info_plus: ^10.2.2
  audioplayers: ^6.8.1
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
